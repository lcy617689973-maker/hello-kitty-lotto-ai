[build]
  publish = "."
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["assets/lotto-records.json", "assets/lotto-stats.json"]

# Netlify schedules are UTC. The function runs every 10 minutes during the
# Wednesday/Saturday result window and only writes when a new official draw appears.
[functions."update-lotto-data"]
  schedule = "*/10 16,17,18,19,20 * * 3,6"

[[headers]]
  for = "/.netlify/functions/lotto-data"
  [headers.values]
    Cache-Control = "public, max-age=30, stale-while-revalidate=120"

[[headers]]
  for = "/assets/lotto-stats.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/lotto-records.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/hello-kitty-template.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
